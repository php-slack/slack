name: Php Unit Tests

on:
  push:
    branches: [ "2.x", "master" ]
  pull_request:
    branches: [ "2.x", "master" ]


jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- PHP 7.1 ---
          - php: 7.1
            guzzle: "^4.0"
          - php: 7.1
            guzzle: "^5.0"
          - php: 7.1
            guzzle: "^6.0"

          # --- PHP 7.2 ---
          - php: 7.2
            guzzle: "^4.0"
          - php: 7.2
            guzzle: "^5.0"
          - php: 7.2
            guzzle: "^6.0"
          - php: 7.2
            guzzle: "^7.0"

          # --- PHP 7.3 ---
          - php: 7.3
            guzzle: "^4.0"
          - php: 7.3
            guzzle: "^5.0"
          - php: 7.3
            guzzle: "^6.0"
          - php: 7.3
            guzzle: "^7.0"

          # --- PHP 7.4 ---
          - php: 7.4
            guzzle: "^4.0"
          - php: 7.4
            guzzle: "^5.0"
          - php: 7.4
            guzzle: "^6.0"
          - php: 7.4
            guzzle: "^7.0"
          - php: 7.4
            guzzle: "^8.0"

          # --- PHP 8.0 ---
          - php: 8.0
            guzzle: "^6.0"
          - php: 8.0
            guzzle: "^7.0"
          - php: 8.0
            guzzle: "^8.0"

          # --- PHP 8.1 ---
          - php: 8.1
            guzzle: "^6.0"
          - php: 8.1
            guzzle: "^7.0"
          - php: 8.1
            guzzle: "^8.0"

          # --- PHP 8.2 ---
          - php: 8.2
            guzzle: "^7.0"
          - php: 8.2
            guzzle: "^8.0"

          # --- PHP 8.3 ---
          - php: 8.3
            guzzle: "^7.0"
          - php: 8.3
            guzzle: "^8.0"

          # --- PHP 8.4 ---
          - php: 8.4
            guzzle: "^7.0"
          - php: 8.4
            guzzle: "^8.0"

          # --- PHP 8.5 ---
          - php: 8.5
            guzzle: "^7.0"
          - php: 8.5
            guzzle: "^8.0"

    name: PHP ${{ matrix.php }}, Guzzle ${{ matrix.guzzle }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP, extensions & tools
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring
        tools: composer:v2
        coverage: xdebug

    - name: Configure Guzzle Version
      run: composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-update --no-interaction

    - name: Install Dependencies
      run: |
        composer config audit.block-insecure false 2> /dev/null || true
        composer install --prefer-dist --no-progress --no-interaction

    - name: Run Tests
      run: |
        case "${{ matrix.php }}" in
          7.1|7.2|7.3|7.4|8.0)
            vendor/bin/phpunit --coverage-clover coverage.xml
            ;;
          *)
            vendor/bin/phpunit -c phpunit10+.xml.dist --coverage-clover coverage.xml
            ;;
        esac
    - name: Code Coverage Summary Report
      uses: saschanowak/CloverCodeCoverageSummary@1.1.1
      with:
        filename: coverage.xml
    - name: 'Add Code Coverage to Job Summary'
      run: |
        cat code-coverage-summary.md >> $GITHUB_STEP_SUMMARY
        cat code-coverage-details.md >> $GITHUB_STEP_SUMMARY
